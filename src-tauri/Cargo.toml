[package]
name = "quillium"
version = "0.13.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quillium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Build without auto-updater for Mac App Store distribution.
# MAS handles updates itself; the updater plugin is not allowed.
# To build for MAS: cargo build --no-default-features --features mas
mas = []
# Default includes the updater (non-MAS builds)
default = ["updater"]
updater = ["tauri-plugin-updater", "tauri-plugin-process"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
