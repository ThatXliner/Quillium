[package]
name = "quillium"
version = "0.17.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quillium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"

# PDF export. printpdf's default features pull in the azul-layout HTML engine
# (→ kuchiki, html5ever, rand 0.7), which does NOT compile for iOS and drags in
# a vulnerable rand. We only use low-level drawing ops + BuiltinFont, so
# default-features=false drops that whole subtree and builds for desktop + iOS.
printpdf = { version = "0.8.2", default-features = false }
textwrap = "0.16.2"

# Desktop-only: self-updater/relaunch are not available on mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
