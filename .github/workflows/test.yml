name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install dependencies
        run: bun install

      # - name: Type check
      #   run: bun run check

      # - name: Lint
      #   run: bun run lint

      - name: Unit tests
        run: bun run test:run
