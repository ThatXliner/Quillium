name: Test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Empty Supabase values create the named static exports while keeping desktop auth disabled.
  # The Web Preview job replaces them with its ephemeral local-stack credentials.
  QUILLIUM_ALLOW_MISSING_SUPABASE_ENV: "1"
  PUBLIC_POSTHOG_HOST: http://127.0.0.1:9999
  PUBLIC_POSTHOG_KEY: ci-test-posthog-key
  PUBLIC_RELAY_URL: ws://127.0.0.1:9998
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
  PUBLIC_SUPABASE_URL: ""

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code_filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web_preview: ${{ steps.filter.outputs.web_preview }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect non-documentation changes
        id: code_filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/README.md'
              - '!.github/**/*.md'
              - '!LICENSE'

      - name: Classify changed packages
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            desktop:
              - '.github/actions/**'
              - '.github/workflows/test.yml'
              - 'bun.lock'
              - 'package.json'
              - 'packages/desktop/**'
              - 'packages/e2e/tests/fixtures.ts'
              - 'packages/share/**'
            web_preview:
              - '.github/actions/**'
              - '.github/workflows/test.yml'
              - 'bun.lock'
              - 'package.json'
              - 'packages/desktop/src/lib/collab/**'
              - 'packages/e2e/**'
              - 'packages/landing/**'
              - 'packages/share/**'
              - 'supabase/**'

  static:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies from lockfile
        run: bun ci

      - name: Type check every package
        run: bun run check:all

      - name: Build landing site
        run: bun run landing:build

  unit:
    name: Cross-package tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies from lockfile
        run: bun ci

      - name: Run unit, property, and cross-package tests
        run: bun run test:all

  desktop_playwright:
    name: Desktop Playwright (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - behavior
          - visual
    env:
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies from lockfile
        run: bun ci

      - name: Install Chromium and system dependencies
        run: bun run --cwd packages/desktop playwright install chromium --with-deps

      - name: Start runtime clock
        run: echo "PLAYWRIGHT_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run focused desktop regression suite
        run: |
          if [[ "${{ matrix.suite }}" == "visual" ]]; then
            bun run --cwd packages/desktop test:e2e \
              tests/e2e/annotationVisualParity.pw.ts \
              --workers=1 \
              --retries=0
          else
            bun run --cwd packages/desktop test:e2e \
              tests/e2e/annotationLifecycle.pw.ts \
              tests/e2e/nestedEditorModal.pw.ts \
              tests/e2e/revisionInteraction.pw.ts \
              tests/e2e/versionHistory.pw.ts
          fi

      - name: Record Playwright runtime and outcomes
        if: always()
        run: |
          if [[ -n "${PLAYWRIGHT_STARTED_AT:-}" ]]; then
            runtime="$(($(date +%s) - PLAYWRIGHT_STARTED_AT))s"
          else
            runtime="unavailable"
          fi
          report="packages/desktop/playwright-results.json"
          {
            echo "### Desktop Playwright (${{ matrix.suite }})"
            echo "- Runtime: ${runtime}"
            if [[ -f "$report" ]]; then
              total=$(jq '[.. | objects | select(has("results") and (.status? != null))] | length' "$report")
              flaky=$(jq '[.. | objects | select(has("results") and .status == "flaky")] | length' "$report")
              failed=$(jq '[.. | objects | select(has("results") and .status == "unexpected")] | length' "$report")
              echo "- Tests: ${total}; flaky: ${flaky}; failed: ${failed}"
            else
              echo "- Results: unavailable (the runner stopped before Playwright wrote JSON)"
            fi
            if [[ "${{ matrix.suite }}" == "visual" ]]; then
              echo "- Flake policy: single worker and no retries; the first pixel failure fails"
            else
              echo "- Flake policy: finite diagnostic retries; any flaky result fails the job"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload desktop Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-${{ matrix.suite }}-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            packages/desktop/playwright-report/
            packages/desktop/playwright-results.json
            packages/desktop/test-results/
            packages/desktop/tests/e2e/**/*-snapshots/

  web_preview:
    name: Web Preview
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.web_preview == 'true'
    runs-on: ubuntu-24.04
    env:
      CI: "1"
      E2E_WEB_PREVIEW_REQUIRED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies from lockfile
        run: bun ci

      - name: Install Chromium and system dependencies
        run: bun run --cwd packages/e2e playwright install chromium --with-deps

      - name: Start runtime clock
        run: echo "PLAYWRIGHT_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Web Preview against ephemeral local Supabase
        run: bun run e2e:test:full

      - name: Record Playwright runtime and outcomes
        if: always()
        run: |
          if [[ -n "${PLAYWRIGHT_STARTED_AT:-}" ]]; then
            runtime="$(($(date +%s) - PLAYWRIGHT_STARTED_AT))s"
          else
            runtime="unavailable"
          fi
          report="packages/e2e/test-results/results.json"
          {
            echo "### Web Preview Playwright"
            echo "- Runtime (including local Supabase): ${runtime}"
            if [[ -f "$report" ]]; then
              total=$(jq '[.. | objects | select(has("results") and (.status? != null))] | length' "$report")
              flaky=$(jq '[.. | objects | select(has("results") and .status == "flaky")] | length' "$report")
              failed=$(jq '[.. | objects | select(has("results") and .status == "unexpected")] | length' "$report")
              echo "- Tests: ${total}; flaky: ${flaky}; failed: ${failed}"
            else
              echo "- Results: unavailable (the runner stopped before Playwright wrote JSON)"
            fi
            echo "- Flake policy: finite diagnostic retries; any flaky result fails the job"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Web Preview Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-preview-playwright-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
            packages/e2e/tests/**/*-snapshots/

  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - static
      - unit
      - desktop_playwright
      - web_preview
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop_playwright.result }}
          WEB_PREVIEW_CHANGED: ${{ needs.changes.outputs.web_preview }}
          WEB_PREVIEW_RESULT: ${{ needs.web_preview.result }}
        run: |
          require_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${label} finished with ${result}"
              return 1
            fi
          }

          require_success "Change detection" "$CHANGES_RESULT"
          if [[ "$CODE_CHANGED" == "true" ]]; then
            require_success "Static checks" "$STATIC_RESULT"
            require_success "Cross-package tests" "$UNIT_RESULT"
          fi
          if [[ "$CODE_CHANGED" == "true" && "$DESKTOP_CHANGED" == "true" ]]; then
            require_success "Desktop Playwright" "$DESKTOP_RESULT"
          fi
          if [[ "$CODE_CHANGED" == "true" && "$WEB_PREVIEW_CHANGED" == "true" ]]; then
            require_success "Web Preview" "$WEB_PREVIEW_RESULT"
          fi
