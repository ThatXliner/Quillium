name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # ARM (M1 and above)
            args: "--target aarch64-apple-darwin"
          # Intel Mac build disabled until TAURI_SIGNING_PRIVATE_KEY is verified
          # - platform: "macos-latest"
          #   args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun ci

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_MAS_PROVISIONING_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          echo "$APPLE_MAS_PROVISIONING_PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile

      - name: Verify Certificate
        if: matrix.platform == 'macos-latest'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Quillium v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

  build-mas:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun ci

      - name: Import MAS certificates
        env:
          APPLE_MAS_CERTIFICATE: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
          APPLE_MAS_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_MAS_CERTIFICATE | base64 --decode > mas-app.p12
          echo $APPLE_MAS_INSTALLER_CERTIFICATE | base64 --decode > mas-installer.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" mas.keychain
          security default-keychain -s mas.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" mas.keychain
          security set-keychain-settings -t 3600 -u mas.keychain
          security import mas-app.p12 -k mas.keychain -P "$APPLE_MAS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import mas-installer.p12 -k mas.keychain -P "$APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" mas.keychain
          security find-identity -v mas.keychain

      - name: Resolve signing identities
        run: |
          APP_CERT=$(security find-identity -v -p codesigning mas.keychain | grep "Apple Distribution" | awk -F'"' '{print $2}' | head -1)
          INSTALLER_CERT=$(security find-identity -v mas.keychain | grep "3rd Party Mac Developer Installer" | awk -F'"' '{print $2}' | head -1)
          echo "APPLE_SIGNING_IDENTITY=$APP_CERT" >> $GITHUB_ENV
          echo "APPLE_INSTALLER_SIGNING_IDENTITY=$INSTALLER_CERT" >> $GITHUB_ENV

      - name: Install provisioning profile
        env:
          APPLE_MAS_PROVISIONING_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          echo $APPLE_MAS_PROVISIONING_PROFILE | base64 --decode > src-tauri/embedded.provisionprofile

      - name: Build universal MAS app
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_MAS: "true"
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run tauri build \
            --bundles app \
            --target universal-apple-darwin \
            -- --no-default-features --features mas

      - name: Package as .pkg
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ env.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Quillium.app"
          xcrun productbuild \
            --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            --component "$APP_PATH" /Applications \
            Quillium.pkg

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type macos \
            --file Quillium.pkg \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_KEY_ISSUER"

  publish-release:
    needs: build-tauri
    if: always() && needs.build-tauri.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all release assets from private repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --dir assets || true
          echo "=== Downloaded assets ==="
          ls -la assets/
          # Bail if no builds succeeded
          if [ -z "$(ls -A assets/ 2>/dev/null)" ]; then
            echo "::error::No release assets found — all builds failed"
            exit 1
          fi

      - name: Build latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/ThatXliner/quillium-releases/releases/download/$TAG"
          export VERSION BASE_URL

          python3 << 'PYEOF'
          import json, os, glob, datetime

          version = os.environ["VERSION"]
          base_url = os.environ["BASE_URL"]

          platforms = {}

          def add_platform(key, artifact, sig_file):
              sig_path = f"assets/{sig_file}"
              if os.path.isfile(sig_path):
                  with open(sig_path) as f:
                      sig = f.read().strip()
                  platforms[key] = {
                      "url": f"{base_url}/{artifact}",
                      "signature": sig,
                  }
              else:
                  print(f"WARNING: {sig_file} not found, skipping {key}")

          # macOS ARM (M1+)
          macos_arm_sigs = glob.glob("assets/*_aarch64.app.tar.gz.sig")
          if macos_arm_sigs:
              sig_name = os.path.basename(macos_arm_sigs[0])
              artifact_name = sig_name.removesuffix(".sig")
              add_platform("darwin-aarch64", artifact_name, sig_name)

          # macOS Intel
          macos_x64_sigs = glob.glob("assets/*_x64.app.tar.gz.sig")
          if macos_x64_sigs:
              sig_name = os.path.basename(macos_x64_sigs[0])
              artifact_name = sig_name.removesuffix(".sig")
              add_platform("darwin-x86_64", artifact_name, sig_name)

          # Linux x86_64
          linux_sigs = glob.glob("assets/*_amd64.AppImage.sig")
          if linux_sigs:
              sig_name = os.path.basename(linux_sigs[0])
              artifact_name = sig_name.removesuffix(".sig")
              add_platform("linux-x86_64", artifact_name, sig_name)

          # Windows x86_64
          win_sigs = glob.glob("assets/*_x64-setup.exe.sig")
          if win_sigs:
              sig_name = os.path.basename(win_sigs[0])
              artifact_name = sig_name.removesuffix(".sig")
              add_platform("windows-x86_64", artifact_name, sig_name)

          result = {
              "version": version,
              "notes": f"Quillium v{version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }

          with open("assets/latest.json", "w") as f:
              json.dump(result, f, indent=2)

          print("=== latest.json ===")
          print(json.dumps(result, indent=2))
          PYEOF

      - name: Create release and upload assets to public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        run: |
          # Create the release in the public repo
          gh release create ${{ github.ref_name }} \
            --repo ThatXliner/quillium-releases \
            --title "Quillium ${{ github.ref_name }}" \
            --notes "See the assets to download and install this version." \
            || true

          # Upload all assets (--clobber to overwrite if re-running)
          gh release upload ${{ github.ref_name }} \
            --repo ThatXliner/quillium-releases \
            --clobber \
            assets/*
