name: Omni Web Preview E2E

on:
  pull_request:
    paths:
      - ".github/workflows/omni-web-preview-e2e.yml"
      - "bun.lock"
      - "package.json"
      - "packages/desktop/src/lib/collab/**"
      - "packages/e2e/**"
      - "packages/landing/src/lib/server/publicShare.ts"
      - "packages/landing/src/routes/share/**"
      - "packages/share/**"
      - "supabase/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/omni-web-preview-e2e.yml"
      - "bun.lock"
      - "package.json"
      - "packages/desktop/src/lib/collab/**"
      - "packages/e2e/**"
      - "packages/landing/src/lib/server/publicShare.ts"
      - "packages/landing/src/routes/share/**"
      - "packages/share/**"
      - "supabase/**"

jobs:
  web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium --with-deps

      - name: Start local Supabase
        run: supabase start

      - name: Run contract, fuzz, component, and browser E2E
        run: bun run e2e:test:full

      - name: Upload browser artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: omni-web-preview-playwright
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
