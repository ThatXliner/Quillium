name: Update Screenshots

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/e2e/screenshots.pw.ts"
      - "static/**"
      - "package.json"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Capture screenshots
        # --update-snapshots overwrites baselines in screenshots/.
        # The dev server is required (not the built preview) so that the
        # window.__runScenario__ bridge is available for seeding annotations.
        run: bunx playwright test --update-snapshots=all tests/e2e/screenshots.pw.ts

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore: auto-update screenshots [skip ci]"
            git push
          fi
