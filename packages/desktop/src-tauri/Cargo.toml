[package]
name = "quillium"
version = "0.23.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quillium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `mcp-bridge` pulls in the dev-only automation plugin. Off by default so
# production `tauri build` never compiles it; `bun run tauri:dev:mcp` turns it on.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Vector search (vec0 virtual table). Compiles its C source via `cc` and
# statically links into the binary — no dylib to ship or sign. Pre-v1: pin
# the minor version and read release notes before bumping.
sqlite-vec = "0.1.9"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"

# Dev-only automation bridge for the Tauri MCP server (live DOM/style/screenshot
# inspection from Claude Code). Optional + behind the `mcp-bridge` feature so it is
# NOT compiled into production: `tauri build` runs without the feature → the crate
# is absent from the release dependency tree. The registration in lib.rs is also
# gated on `debug_assertions` as a second safety net. Enabled only via `bun run
# tauri:dev:mcp` (which passes `--features mcp-bridge`).
tauri-plugin-mcp-bridge = { version = "0.11", optional = true }

# PDF export. printpdf's default features pull in the azul-layout HTML engine
# (→ kuchiki, html5ever, rand 0.7), which does NOT compile for iOS and drags in
# a vulnerable rand. We only use low-level drawing ops, so default-features=false
# drops that whole subtree and builds for desktop + iOS.
printpdf = { version = "0.8.2", default-features = false }
textwrap = "0.16.2"
# System-font discovery for PDF export. printpdf's built-in fonts declare
# WinAnsiEncoding but emit raw UTF-8 bytes, corrupting any non-ASCII text
# (issue #311), so we embed a Unicode system font instead. Already present as a
# transitive dep (via printpdf → svg2pdf), so this adds no new crates.
fontdb = "0.23"
tauri-plugin-http = "2.5.9"
tauri-plugin-notification = "2"

# Desktop-only: self-updater/relaunch are not available on mobile targets.
# fastembed (ONNX Runtime via ort) is desktop-only too — ort's prebuilt
# binaries don't target iOS/Android, so mobile builds fall back to
# keyword-only search (see src/embeddings.rs). default-features off drops
# the unused image-embedding models; we keep the ort binary download and
# the hf-hub model download (bge-small-en-v1.5, fetched lazily at runtime
# into the app data dir).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
fastembed = { version = "5.16", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

[dev-dependencies]
tempfile = "3"
