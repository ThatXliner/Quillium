<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F5F4F1;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="27"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-branching-mind"
        class="scene"
        data-composition-id="01-branching-mind"
        data-composition-src="compositions/frames/01-branching-mind.html"
        data-start="0"
        data-duration="6.3"
        data-track-index="0"
      ></div>

      <div
        id="el-02-every-version"
        class="scene"
        data-composition-id="02-every-version"
        data-composition-src="compositions/frames/02-every-version.html"
        data-start="5.4"
        data-duration="6.8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-revision-in-draft"
        class="scene"
        data-composition-id="03-revision-in-draft"
        data-composition-src="compositions/frames/03-revision-in-draft.html"
        data-start="11.4"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-branch-inside-branch"
        class="scene"
        data-composition-id="04-branch-inside-branch"
        data-composition-src="compositions/frames/04-branch-inside-branch.html"
        data-start="17"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-start-writing-sideways"
        class="scene"
        data-composition-id="05-start-writing-sideways"
        data-composition-src="compositions/frames/05-start-writing-sideways.html"
        data-start="21"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-branching-mind", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.9, ease: "power3.in" }, 5.4);
        tl.fromTo("#el-02-every-version", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 5.4);
        tl.to("#el-02-every-version", { opacity: 0, duration: 0.8, ease: "power2.inOut" }, 11.4);
        tl.fromTo("#el-03-revision-in-draft", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 11.4);
        tl.to("#el-03-revision-in-draft", { opacity: 0, duration: 0.9, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-04-branch-inside-branch", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.inOut" }, 17);
        tl.to("#el-04-branch-inside-branch", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 1, ease: "power2.inOut" }, 21);
        tl.fromTo("#el-05-start-writing-sideways", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 1, ease: "power2.inOut" }, 21);
        tl.to({}, { duration: 27 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
