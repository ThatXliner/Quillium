<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
    </head>
    <body>
        <template>
            <style>
                @font-face {
                    font-family: "Inter";
                    src: url("capture/assets/fonts/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfMZg.ttf")
                        format("truetype");
                    font-style: normal;
                    font-weight: 400;
                }

                @font-face {
                    font-family: "Inter";
                    src: url("capture/assets/fonts/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuI6fMZg.ttf")
                        format("truetype");
                    font-style: normal;
                    font-weight: 500;
                }

                @font-face {
                    font-family: "Newsreader";
                    src: url("capture/assets/fonts/cY9qfjOCX1hbuyalUrK49dLac06G1ZGsZBtoBCzBDXXD9JVF438weI_ADA.ttf")
                        format("truetype");
                    font-style: normal;
                    font-weight: 400;
                }

                * {
                    box-sizing: border-box;
                }

                #root {
                    position: absolute;
                    inset: 0;
                    width: 1080px;
                    height: 1920px;
                    overflow: hidden;
                    container-type: size;
                    color: #000000;
                    font-family: "Inter", sans-serif;
                }

                .background {
                    position: absolute;
                    inset: 0;
                    overflow: hidden;
                    background: #f5f4f1;
                }

                .drafting-line {
                    position: absolute;
                    top: 0;
                    left: 76px;
                    width: 1px;
                    height: 1600px;
                    background: #a855f7;
                    opacity: 0.14;
                }

                .geo-ring {
                    position: absolute;
                    top: 68px;
                    right: -292px;
                    width: 640px;
                    height: 640px;
                    border: 1px solid #a855f7;
                    border-radius: 50%;
                    opacity: 0.13;
                }

                .geo-ring::before {
                    position: absolute;
                    inset: 92px;
                    content: "";
                    border: 1px dashed #a855f7;
                    border-radius: 50%;
                }

                .branch-field {
                    position: absolute;
                    inset: 0;
                    width: 1080px;
                    height: 760px;
                    overflow: hidden;
                }

                .branch-paths {
                    position: absolute;
                    inset: 0;
                    width: 1080px;
                    height: 760px;
                    overflow: visible;
                }

                .branch-path {
                    fill: none;
                    stroke: #a855f7;
                    stroke-linecap: round;
                    stroke-width: 1;
                    vector-effect: non-scaling-stroke;
                }

                .branch-path.quiet {
                    opacity: 0.55;
                }

                .branch-label {
                    position: absolute;
                    width: 392px;
                    min-height: 82px;
                    display: flex;
                    align-items: center;
                    padding: 18px 22px 15px;
                    overflow: hidden;
                    border: 1px solid rgba(168, 85, 247, 0.56);
                    background: rgba(255, 255, 255, 0.3);
                    color: #000000;
                    font-family: "Newsreader", serif;
                    font-size: 34px;
                    font-weight: 400;
                    line-height: 1.08;
                    white-space: nowrap;
                    will-change: transform, opacity;
                }

                .branch-label.selected {
                    border-color: #a855f7;
                }

                .branch-one {
                    top: 286px;
                    left: 76px;
                }

                .branch-two {
                    top: 430px;
                    left: 344px;
                }

                .branch-three {
                    top: 574px;
                    left: 612px;
                }

                .promise {
                    position: absolute;
                    top: 126px;
                    left: 88px;
                    width: 904px;
                    min-height: 300px;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    text-align: left;
                }

                .promise-line {
                    display: block;
                    width: 100%;
                    color: #000000;
                    font-family: "Newsreader", serif;
                    font-size: 92px;
                    font-weight: 400;
                    line-height: 0.98;
                    letter-spacing: -2px;
                    will-change: transform, opacity;
                }

                .promise-two {
                    color: #7c3aed;
                }

                .sentence-strip {
                    position: absolute;
                    top: 486px;
                    left: 88px;
                    width: 904px;
                    height: 112px;
                    display: flex;
                    align-items: center;
                    padding: 0 34px;
                    overflow: hidden;
                    border-top: 1px solid #a855f7;
                    border-bottom: 1px solid #a855f7;
                    background: rgba(218, 183, 252, 0.42);
                    color: #000000;
                    font-family: "Newsreader", serif;
                    font-size: 48px;
                    font-weight: 400;
                    line-height: 1;
                    white-space: nowrap;
                    will-change: transform, opacity;
                }

                .sentence-strip::after {
                    position: absolute;
                    right: 26px;
                    bottom: 22px;
                    left: 28px;
                    height: 3px;
                    content: "";
                    background: #a855f7;
                    opacity: 0.72;
                }

                .morph-card {
                    position: absolute;
                    top: 486px;
                    left: 50%;
                    width: 760px;
                    height: 112px;
                    overflow: hidden;
                    border: 1px solid #a855f7;
                    border-radius: 0;
                    background: rgba(255, 255, 255, 0.3);
                    will-change: width, height, transform, opacity;
                }

                .morph-old,
                .morph-new {
                    position: absolute;
                    inset: 0;
                }

                .morph-old {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                .old-path {
                    color: #000000;
                    font-family: "Newsreader", serif;
                    font-size: 36px;
                    font-weight: 400;
                    line-height: 1;
                    white-space: nowrap;
                }

                .morph-new {
                    overflow: hidden;
                    background: #f5f2fb;
                }

                .revision-crop {
                    position: absolute;
                    top: -26px;
                    left: 0;
                    width: 932px;
                    height: 1331px;
                    max-width: none;
                    display: block;
                    object-fit: fill;
                }

                .ui-caption {
                    position: absolute;
                    right: 28px;
                    bottom: 24px;
                    padding: 12px 16px 9px;
                    border: 1px solid rgba(168, 85, 247, 0.42);
                    background: rgba(245, 244, 241, 0.9);
                    color: #7c3aed;
                    font-size: 15px;
                    font-weight: 500;
                    letter-spacing: 3px;
                    line-height: 1;
                    text-transform: uppercase;
                }
            </style>

            <div
                id="root"
                data-composition-id="02-every-version"
                data-duration="6.8"
                data-width="1080"
                data-height="1920"
            >
                <div
                    id="02-every-version-background"
                    class="clip background"
                    data-start="0"
                    data-duration="6.0"
                    data-track-index="0"
                >
                    <div class="drafting-line"></div>
                    <div class="geo-ring"></div>
                </div>

                <div class="branch-field" data-layout-allow-overlap>
                    <svg class="branch-paths" viewBox="0 0 1080 760" aria-hidden="true">
                        <path
                            class="branch-path quiet"
                            pathLength="1"
                            d="M 180 0 C 180 122, 150 204, 272 286"
                        ></path>
                        <path
                            class="branch-path"
                            pathLength="1"
                            d="M 540 0 C 540 154, 540 286, 540 430"
                        ></path>
                        <path
                            class="branch-path quiet"
                            pathLength="1"
                            d="M 900 0 C 900 208, 930 388, 808 574"
                        ></path>
                    </svg>

                    <div class="branch-label branch-one selected">The rain found her…</div>
                    <div class="branch-label branch-two">She stepped into…</div>
                    <div class="branch-label branch-three">Rain met her…</div>
                </div>

                <div class="promise" data-layout-allow-overlap>
                    <span class="promise-line promise-one">Fork any sentence.</span>
                    <span class="promise-line promise-two">Keep every version.</span>
                </div>

                <div class="sentence-strip">The rain found her…</div>

                <div class="morph-card">
                    <div class="morph-old">
                        <div class="old-path">The rain found her…</div>
                    </div>
                    <div class="morph-new">
                        <img
                            class="revision-crop"
                            data-layout-allow-overflow
                            src="assets/rain-revision-card.png"
                            alt="Quillium revision controls for The rain found her beneath the station clock"
                        />
                        <div class="ui-caption">Revision paths</div>
                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
            <script>
                window.__timelines = window.__timelines || {};
                const tl = gsap.timeline({ paused: true });

                const branchPaths = gsap.utils.toArray(".branch-path");
                const branchLabels = gsap.utils.toArray(".branch-label");

                branchPaths.forEach((path, index) => {
                    tl.fromTo(
                        path,
                        { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0 },
                        {
                            strokeDashoffset: 0,
                            opacity: index === 1 ? 1 : 0.55,
                            duration: 0.75,
                            ease: "power2.out",
                        },
                        0.04 + index * 0.13,
                    );
                });

                const assembleStarts = [
                    { x: 92, y: -60 },
                    { x: 0, y: -76 },
                    { x: -92, y: -60 },
                ];

                branchLabels.forEach((label, index) => {
                    tl.fromTo(
                        label,
                        {
                            x: assembleStarts[index].x,
                            y: assembleStarts[index].y,
                            scale: 0.9,
                            opacity: 0,
                        },
                        {
                            x: 0,
                            y: 0,
                            scale: 1,
                            opacity: 1,
                            duration: 0.75,
                            ease: "power3.out",
                        },
                        0.25 + index * 0.12,
                    );
                });

                const stackTargets = [
                    { x: 268, y: 200 },
                    { x: 0, y: 56 },
                    { x: -268, y: -88 },
                ];

                tl.to(branchPaths, { opacity: 0.1, duration: 0.5, ease: "power2.in" }, 1.2);

                branchLabels.forEach((label, index) => {
                    tl.to(
                        label,
                        {
                            x: stackTargets[index].x,
                            y: stackTargets[index].y,
                            duration: 0.85,
                            ease: "power2.inOut",
                            overwrite: "auto",
                        },
                        1.2 + index * 0.06,
                    );
                });

                tl.fromTo(
                    ".morph-card",
                    {
                        xPercent: -50,
                        y: 0,
                        width: 760,
                        height: 112,
                        opacity: 0,
                    },
                    {
                        xPercent: -50,
                        y: 0,
                        width: 760,
                        height: 112,
                        opacity: 1,
                        duration: 0.3,
                        ease: "power1.out",
                    },
                    1.5,
                );

                tl.fromTo(
                    ".morph-old",
                    { opacity: 0 },
                    { opacity: 1, duration: 0.2, ease: "power1.out" },
                    1.55,
                );
                tl.to(branchLabels, { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.6);

                tl.fromTo(
                    ".sentence-strip",
                    { y: 18, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
                    1.9,
                );

                tl.fromTo(
                    ".morph-card",
                    {
                        xPercent: -50,
                        y: 0,
                        width: 760,
                        height: 112,
                        backgroundColor: "rgba(255,255,255,0.3)",
                    },
                    {
                        xPercent: -50,
                        y: 164,
                        width: 932,
                        height: 850,
                        backgroundColor: "rgba(255,255,255,0.3)",
                        duration: 1.8,
                        ease: "power2.inOut",
                    },
                    1.8,
                );

                tl.to(".morph-old", { opacity: 0, duration: 0.65, ease: "power1.in" }, 1.75);
                tl.fromTo(
                    ".morph-new",
                    { opacity: 0 },
                    { opacity: 1, duration: 0.8, ease: "power1.out" },
                    2.8,
                );

                const phraseContent = [
                    { selector: ".promise-one", text: "Fork any sentence.", hold: 0.03 },
                    { selector: ".promise-two", text: "Keep every version.", hold: 0.07 },
                ];
                const phraseBaseDuration = 0.18;
                const phraseSecondsPerCharacter = 0.004;
                let phraseCursor = 3.6;
                const phraseTimeline = phraseContent.map((phrase) => {
                    const duration =
                        phraseBaseDuration +
                        phrase.text.length * phraseSecondsPerCharacter +
                        phrase.hold;
                    const start = phraseCursor;
                    phraseCursor += duration;
                    return { ...phrase, start, duration };
                });

                phraseTimeline.forEach((phrase) => {
                    tl.fromTo(
                        phrase.selector,
                        { y: 30, opacity: 0 },
                        {
                            y: 0,
                            opacity: 1,
                            duration: phrase.duration - phrase.hold,
                            ease: "power3.out",
                        },
                        phrase.start,
                    );
                });

                // Deliberate reading hold before the transition overlap begins.
                tl.to({}, { duration: 1.8 }, 4.2);

                window.__timelines["02-every-version"] = tl;
            </script>
        </template>
    </body>
</html>
